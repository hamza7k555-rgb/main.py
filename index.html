<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloader</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--tg-theme-bg-color,#1a2a3a);color:var(--tg-theme-text-color,#fff);font-family:Arial,sans-serif}
  .box{max-width:420px;margin:0 auto}
  h2{text-align:center;margin:0 0 15px}
  input,select,button{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:none;font-size:16px}
  input,select{background:#fff;color:#000}
  button{background:#2AABEE;color:#fff;font-weight:bold;cursor:pointer}
  button:disabled{opacity:.5}
  .row{display:flex;gap:10px}
  .row button{background:#333}
  .row button.active{background:#2AABEE}
  #status{text-align:center;margin-top:12px;min-height:22px;font-size:15px}
  .progress{width:100%;height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;display:none}
  .progress-bar{height:100%;background:#2AABEE;width:0%;transition:width .3s}
  .hint{font-size:13px;opacity:.7;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h2>تحميل فيديو / صوت 🎬</h2>
  <input id="videoUrl" type="url" placeholder="حط رابط الفيديو هنا..." />
  <div class="row">
    <button id="btnVideo" class="active" onclick="setType('video')">فيديو 🎬</button>
    <button id="btnAudio" onclick="setType('audio')">صوت فقط 🎵</button>
  </div>
  <div id="qualityBox">
    <select id="quality">
      <option value="1080">1080p - عالية</option>
      <option value="720" selected>720p - متوسطة</option>
      <option value="480">480p - خفيفة</option>
      <option value="360">360p - أقل حجم</option>
    </select>
  </div>
  <button id="sendBtn" onclick="sendRequest()">ابعتلي على التيليجرام</button>
  <div class="progress" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
  <div id="status"></div>
  <div class="hint">بيفتح جوه البوت بس، مش من المتصفح</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let selectedType = 'video';

function setType(type){
  selectedType = type;
  document.getElementById('btnVideo').classList.toggle('active', type==='video');
  document.getElementById('btnAudio').classList.toggle('active', type==='audio');
  document.getElementById('qualityBox').style.display = type==='video' ? 'block' : 'none';
}
function updateProgress(p){
  document.getElementById('progressWrap').style.display='block';
  document.getElementById('progressBar').style.width=p+'%';
}

async function sendRequest(){
  const url = document.getElementById('videoUrl').value.trim();
  const quality = document.getElementById('quality').value;
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('sendBtn');

  if(!url){ statusEl.textContent='حط اللينك الأول'; return; }

  // قراءة صحيحة من جوه Web App - مش من ?chatId=
  const user = tg.initDataUnsafe?.user;
  const chatId = user?.id;

  if(!chatId){
    statusEl.textContent='افتح الصفحة من جوه بوت التيليجرام';
    return;
  }

  btn.disabled = true;
  updateProgress(30);
  statusEl.textContent='بيتم تجهيز طلبك...';

  try{
    const res = await fetch('/.netlify/functions/send-media', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        chatId: chatId,
        url: url,
        type: selectedType,
        quality: selectedType==='video' ? quality : 'audio',
        initData: tg.initData
      })
    });
    updateProgress(70);
    const result = await res.json();

    if(result.success){
      updateProgress(100);
      statusEl.textContent='تم ✅ اتبعتلك على التيليجرام';
      setTimeout(()=> tg.close(), 1200);
    } else {
      statusEl.textContent='حصل مشكلة: '+(result.error || 'حاول تاني');
      btn.disabled = false;
    }
  }catch(e){
    statusEl.textContent='مشكلة في الاتصال، حاول تاني';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
