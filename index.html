<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:sans-serif;background:#111827;color:#fff;padding:20px;text-align:center}
input,select{width:100%;padding:14px;border-radius:12px;border:0;margin:10px 0;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
#status{margin-top:15px;color:#a78bfa}
</style>
</head>
<body>
<h2>حمّل فيديو او صوت</h2>
<input id="url" placeholder="الصق لينك الفيديو هنا...">
<select id="format">
  <option value="video">فيديو MP4</option>
  <option value="audio">صوت فقط MP3</option>
</select>
<select id="quality">
  <option value="best">افضل جودة</option>
  <option value="720p">720p</option>
  <option value="480p">480p</option>
  <option value="360p">360p</option>
</select>
<button onclick="send()">ابعتلي الملف في تيليجرام</button>
<div id="status"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

async function send(){
  const url = document.getElementById('url').value.trim();
  const format = document.getElementById('format').value;
  const quality = document.getElementById('quality').value;
  if(!url) return alert('حط اللينك الاول');
  document.getElementById('status').innerText = 'جاري التحميل... سيصلك الملف في الشات، متقفّلش الصفحة';

  const chatId = tg.initDataUnsafe?.user?.id;

  const res = await fetch('/.netlify/functions/send-media', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ url, format, quality, chatId })
  });
  const data = await res.json();
  if(data.ok){
    document.getElementById('status').innerText = 'تم! الملف اتبعت في الشات ✅';
    setTimeout(()=> tg.close(), 1500);
  } else {
    document.getElementById('status').innerText = 'حصل خطأ: ' + (data.error || 'حاول تاني');
  }
}
</script>
</body>
</html>
